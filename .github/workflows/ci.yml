name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its running checks; main runs always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Job names "Smoke (structure)" and "Build & test (macOS)" are required checks
  # in branch protection. Rename them there too if you rename them here.
  smoke:
    name: Smoke (structure)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash Scripts/smoke.sh
      - name: Lint workflows
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  # Skips the macOS build when only docs changed. A skipped job still
  # satisfies a required check.
  changes:
    name: Detect app changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.diff.outputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          app=true
          if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch ]] && git cat-file -e "${BASE}^{commit}" 2>/dev/null \
            && git diff --quiet "$BASE" "$GITHUB_SHA" -- Lyra LyraTests Lyra.xcodeproj Scripts .github/workflows; then
            app=false
          fi
          echo "app=$app" | tee -a "$GITHUB_OUTPUT"

  macos:
    name: Build & test (macOS)
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
      - name: Build and test
        env:
          RESULT_BUNDLE: build/Lyra.xcresult
          TEST_RUNNER_LYRA_SNAPSHOTS: "1"
        run: bash Scripts/xcode-test.sh
      # The sandboxed test host writes its PNGs inside the app container.
      - name: Collect snapshots
        if: always()
        run: |
          mkdir -p build/snapshots
          find "$HOME/Library/Containers/app.lyra.Lyra/Data/tmp/LyraSnapshots" -name '*.png' \
            -exec cp {} build/snapshots/ \; 2>/dev/null || true
          ls build/snapshots
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: lyra-snapshots
          path: build/snapshots/*.png
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: Lyra-xcresult
          path: build/Lyra.xcresult
          if-no-files-found: ignore
          retention-days: 7
