name: Release

# Merging a MARKETING_VERSION bump to main tags v<version> and publishes a
# GitHub Release with the DMG. Run it by hand on main to retry a failed
# release, or on any branch for a DMG artifact without a release.
on:
  push:
    branches: [main]
    paths: [Lyra.xcodeproj/project.pbxproj]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
      build: ${{ steps.plan.outputs.build }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: plan
        run: |
          version="$(grep -o 'MARKETING_VERSION = [^;]*' Lyra.xcodeproj/project.pbxproj | awk '{print $3}' | sort -u)"
          released=false
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            released=true
          fi
          # A project change without a version bump has nothing to ship.
          build=true
          if [[ "$GITHUB_EVENT_NAME" == push && "$released" == true ]]; then
            build=false
          fi
          publish=false
          if [[ "$GITHUB_REF" == refs/heads/main && "$released" == false ]]; then
            publish=true
          fi
          printf 'version=%s\nbuild=%s\npublish=%s\n' "$version" "$build" "$publish" | tee -a "$GITHUB_OUTPUT"

  dmg:
    name: Build DMG
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
      - name: Build DMG
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: bash Scripts/package-dmg.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Lyra-dmg
          path: |
            build/dist/*.dmg
            build/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - id: sums
        if: needs.plan.outputs.publish == 'true'
        run: |
          {
            echo "text<<EOF"
            cat build/dist/SHA256SUMS.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      # Creates the tag on this commit.
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: needs.plan.outputs.publish == 'true'
        with:
          tag_name: v${{ needs.plan.outputs.version }}
          name: v${{ needs.plan.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            build/dist/*.dmg
            build/dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            Open the DMG and drag **Lyra** to **Applications**. Runs on macOS 15 or later.

            This build is ad-hoc signed, not notarized. If macOS blocks the first launch, open **System Settings → Privacy & Security** and click **Open Anyway**.

            SHA-256:
            ```
            ${{ steps.sums.outputs.text }}
            ```
