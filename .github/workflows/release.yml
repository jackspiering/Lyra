name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version label for the DMG (e.g. 0.5.0). Leave empty to use MARKETING_VERSION."
        required: false
        default: ""

# Only this workflow needs write (create/update GitHub Release assets).
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dmg:
    name: Build DMG
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          sw_vers

      - name: Resolve version
        id: ver
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.version }}" ]]; then
            V="${{ inputs.version }}"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            V="${GITHUB_REF_NAME}"
          else
            V=""
          fi
          V="${V#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Resolved version: '${V:-from project}'"

      - name: Build DMG
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: bash Scripts/package-dmg.sh

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: Lyra-dmg
          path: build/dist/*.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: build/dist/*.dmg
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            Unsigned macOS build for testing (not notarized).

            - Open the DMG and drag **Lyra** to **Applications**.
            - First launch: right-click → **Open** if Gatekeeper warns (unsigned CI build).
            - Built by GitHub Actions on `macos-15`.

            Commit: `${{ github.sha }}`
