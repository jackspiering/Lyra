name: Release

# Merging a MARKETING_VERSION bump to main tags v<version> and publishes a
# GitHub Release with the DMG. Run it by hand on main to retry a failed
# release, or on any branch for a DMG artifact without a release.
on:
  push:
    branches: [main]
    paths: [Lyra.xcodeproj/project.pbxproj]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
      build: ${{ steps.plan.outputs.build }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: plan
        run: |
          version="$(grep -o 'MARKETING_VERSION = [^;]*' Lyra.xcodeproj/project.pbxproj | awk '{print $3}' | sort -u)"
          released=false
          rc=0
          git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null || rc=$?
          case "$rc" in
            0) released=true ;;
            2) ;; # no such tag
            *)
              echo "::error::Could not list remote tags (git ls-remote exited $rc)."
              exit 1
              ;;
          esac
          # A project change without a version bump has nothing to ship.
          build=true
          if [[ "$GITHUB_EVENT_NAME" == push && "$released" == true ]]; then
            build=false
          fi
          publish=false
          if [[ "$GITHUB_REF" == refs/heads/main && "$released" == false ]]; then
            publish=true
          fi
          printf 'version=%s\nbuild=%s\npublish=%s\n' "$version" "$build" "$publish" | tee -a "$GITHUB_OUTPUT"

  dmg:
    name: Build DMG
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    # Only this job creates the tag and the release.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
      - name: Build DMG
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: bash Scripts/package-dmg.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Lyra-dmg
          path: |
            build/dist/*.dmg
            build/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - id: sums
        if: needs.plan.outputs.publish == 'true'
        run: |
          {
            echo "text<<EOF"
            cat build/dist/SHA256SUMS.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      # Signed statement that this DMG was built by this workflow from this commit.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: needs.plan.outputs.publish == 'true'
        with:
          subject-path: build/dist/*.dmg
      # Creates the tag on this commit.
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        if: needs.plan.outputs.publish == 'true'
        with:
          tag_name: v${{ needs.plan.outputs.version }}
          name: v${{ needs.plan.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            build/dist/*.dmg
            build/dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            Open the DMG and drag **Lyra** to **Applications**. Runs on macOS 15 or later.

            This build is ad-hoc signed, not notarized. If macOS blocks the first launch, open **System Settings → Privacy & Security** and click **Open Anyway**.

            SHA-256:
            ```
            ${{ steps.sums.outputs.text }}
            ```

            Verify where this build came from: `gh attestation verify Lyra-${{ needs.plan.outputs.version }}.dmg --repo jackspiering/Lyra`
