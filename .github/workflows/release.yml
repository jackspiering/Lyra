name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version label for the DMG (e.g. 0.5.0). Leave empty to use MARKETING_VERSION."
        required: false
        default: ""

# Only this workflow needs write (create/update GitHub Release assets).
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dmg:
    name: Build DMG
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          sw_vers

      - name: Resolve version
        id: ver
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          EXPLICIT_VERSION=false
          if [[ "$EVENT_NAME" == "workflow_dispatch" && -n "${INPUT_VERSION:-}" ]]; then
            V="$INPUT_VERSION"
            EXPLICIT_VERSION=true
          elif [[ "$REF_TYPE" == "tag" ]]; then
            V="$REF_NAME"
            EXPLICIT_VERSION=true
          else
            V=""
          fi
          V="${V#v}"
          if [[ "$EXPLICIT_VERSION" == true ]] && ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "error: version must be three-part semver (e.g. 0.6.2), got '$V'" >&2
            exit 1
          fi
          printf 'version=%s\n' "$V" >> "$GITHUB_OUTPUT"
          echo "Resolved version: '${V:-from project}'"

      - name: Guard version matches project
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          V="${VERSION:-}"
          if [[ -z "$V" ]]; then
            echo "No explicit version (workflow_dispatch without input) — package-dmg will use MARKETING_VERSION."
            exit 0
          fi
          # Require three-part semver so a tag like v0.6 cannot ship with ambiguous marketing version.
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "error: version must be three-part semver (e.g. 0.6.2), got '$V'" >&2
            exit 1
          fi
          PROJ="$(grep -o 'MARKETING_VERSION = [^;]*' Lyra.xcodeproj/project.pbxproj | awk '{print $3}' | sort -u)"
          COUNT="$(printf '%s\n' "$PROJ" | grep -c . || true)"
          if [[ "$COUNT" -ne 1 ]]; then
            echo "error: MARKETING_VERSION diverges in project.pbxproj:" >&2
            printf '%s\n' "$PROJ" >&2
            exit 1
          fi
          if [[ "$PROJ" != "$V" ]]; then
            echo "error: tag/version $V does not match MARKETING_VERSION $PROJ" >&2
            echo "       Bump MARKETING_VERSION in the Xcode project before tagging." >&2
            exit 1
          fi
          echo "ok: $V matches MARKETING_VERSION"

      - name: Build DMG
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: bash Scripts/package-dmg.sh

      - name: Checksums
        id: sums
        run: |
          set -euo pipefail
          HASHES="$(shasum -a 256 build/dist/*.dmg)"
          echo "$HASHES"
          printf '%s\n' "$HASHES" > build/dist/SHA256SUMS.txt
          {
            echo "hashes<<EOF"
            echo "$HASHES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Lyra-dmg
          path: |
            build/dist/*.dmg
            build/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            build/dist/*.dmg
            build/dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            Ad-hoc-signed macOS build for testing (not notarized).

            - Open the DMG and drag **Lyra** to **Applications**.
            - First launch: right-click → **Open** if Gatekeeper warns (ad-hoc CI build).
            - Built by GitHub Actions on `macos-15`.
            - Verify the DMG against the SHA-256 below (also in `SHA256SUMS.txt`).

            SHA-256:
            ```
            ${{ steps.sums.outputs.hashes }}
            ```

            Commit: `${{ github.sha }}`
