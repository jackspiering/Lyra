# Keep GitHub Actions on supported major tags (Node runtime deprecations, etc.).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    # One pull request per month for all action bumps.
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - dependencies
      - ci
