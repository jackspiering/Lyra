<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Lyra app icon: a gold lyre under Vega on the Night sky.
       macOS template: an 824pt rounded square centered on a 1024 canvas.
       The AppIcon PNGs in Lyra/Resources/Assets.xcassets are rendered from this file. -->
  <defs>
    <path id="shape" d="M 285.4 100 H 738.6 C 841 100 924 183 924 285.4 V 738.6 C 924 841 841 924 738.6 924 H 285.4 C 183 924 100 841 100 738.6 V 285.4 C 100 183 183 100 285.4 100 Z"/>
    <clipPath id="clip"><use href="#shape"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2F66"/>
      <stop offset="0.55" stop-color="#151938"/>
      <stop offset="1" stop-color="#0C0F22"/>
    </linearGradient>
    <radialGradient id="haze" cx="0.5" cy="0.08" r="0.7">
      <stop offset="0" stop-color="#6D6BD8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#6D6BD8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="0" y1="280" x2="0" y2="770">
      <stop offset="0" stop-color="#FFF1CF"/>
      <stop offset="1" stop-color="#E9B866"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F4C881" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#F4C881" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <use href="#shape" filter="url(#shadow)"/>
  <g clip-path="url(#clip)">
    <rect width="1024" height="1024" fill="url(#night)"/>
    <rect width="1024" height="1024" fill="url(#haze)"/>

    <!-- Lyre: horned frame, yoke, bridge, three strings. -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path stroke="url(#gold)" stroke-width="46" d="M 322 304 C 362 282 400 318 392 372 C 384 432 322 470 322 562 C 322 672 412 744 512 744 C 612 744 702 672 702 562 C 702 470 640 432 632 372 C 624 318 662 282 702 304"/>
      <path stroke="url(#gold)" stroke-width="40" d="M 350 384 H 674"/>
      <path stroke="url(#gold)" stroke-width="30" d="M 432 664 H 592"/>
      <path stroke="#FBE3B4" stroke-width="12" d="M 462 384 V 664 M 512 384 V 664 M 562 384 V 664"/>
    </g>

    <!-- Vega, the brightest star in Lyra. -->
    <circle cx="512" cy="232" r="92" fill="url(#glow)"/>
    <circle cx="512" cy="232" r="28" fill="#FFF1CF"/>
  </g>
</svg>
